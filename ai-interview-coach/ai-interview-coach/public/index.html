      --ink: #eef0ff;
      --mute: #aab3dd;
      --glass: rgba(16, 20, 44, .72);
      --line: rgba(255, 255, 255, .14);
      --a1: #4458e6;
      --a2: #8b5cf6;
      --amber: #f5b942;
      --warn: #ff8a65
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: #0d1124 var(--bg-image) center/cover no-repeat fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px
    }

    .app {
      width: 100%;
      max-width: 820px;
      height: 100%;
      max-height: 900px;
      display: flex;
      flex-direction: column;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .55);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px)
    }

    header {
      background: linear-gradient(120deg, var(--a1), var(--a2));
      color: #fff;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      gap: 14px
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .18);
      border: 2px solid rgba(255, 255, 255, .55);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: .5px
    }

    header h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 650
    }

    header p {
      margin: 3px 0 0;
      font-size: 13px;
      opacity: .85
    }

    .status {
      margin-left: auto;
      font-size: 13px;
      background: rgba(0, 0, 0, .25);
      padding: 5px 12px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 7px
    }

    .status i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #5eead4;
      display: inline-block;
      box-shadow: 0 0 8px #5eead4
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: #4a5499 transparent
    }

    .msg {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 15.5px;
      white-space: pre-wrap
    }

    .bot {
      background: rgba(255, 255, 255, .09);
      border: 1px solid var(--line);
      align-self: flex-start;
      border-top-left-radius: 5px
    }

    .user {
      background: linear-gradient(135deg, var(--a1), var(--a2));
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
      box-shadow: 0 6px 18px rgba(68, 88, 230, .35)
    }

    .warn {
      border-color: var(--warn);
      background: rgba(255, 138, 101, .14);
      color: #ffd9cc
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 22px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, .03)
    }

    .chips button {
      border: 1px solid rgba(245, 185, 66, .7);
      background: rgba(245, 185, 66, .08);
      color: var(--amber);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13.5px;
      cursor: pointer;
      transition: all .15s
    }

    .chips button:hover,
    .chips button:focus-visible {
      background: var(--amber);
      color: #1b1b2f;
      outline: none;
      transform: translateY(-1px)
    }

    form {
      display: flex;
      gap: 10px;
      padding: 14px 22px;
      border-top: 1px solid var(--line)
    }

    input {
      flex: 1;
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 15.5px;
      background: rgba(255, 255, 255, .08);
      color: var(--ink)
    }

    input::placeholder {
      color: #8f99c9
    }

    input:focus {
      outline: 2px solid var(--a2);
      border-color: var(--a2)
    }

    form button {
      background: linear-gradient(135deg, var(--amber), #f59e0b);
      color: #1b1b2f;
      font-weight: 650;
      border: 0;
      border-radius: 14px;
      padding: 0 26px;
      font-size: 15.5px;
      cursor: pointer;
      transition: filter .15s
    }

    form button:hover {
      filter: brightness(1.08)
    }

    form button:disabled {
      opacity: .55;
      cursor: wait
    }

    .note {
      font-size: 12px;
      text-align: center;
      color: var(--mute);
      padding: 0 22px 14px
    }

    .dots span {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin: 0 2px;
      border-radius: 50%;
      background: var(--amber);
      animation: b 1s infinite
    }

    .dots span:nth-child(2) {
      animation-delay: .15s
    }

    .dots span:nth-child(3) {
      animation-delay: .3s
    }

    @keyframes b {

      0%,
      80%,
      100% {
        opacity: .25
      }

      40% {
        opacity: 1
      }
    }

    @media (max-width:600px) {
      body {
        padding: 0
      }

      .app {
        border-radius: 0;
        max-height: none;
        border: 0
      }

      .status {
        display: none
      }

      .msg {
        max-width: 92%
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .dots span {
        animation: none
      }

      .chips button {
        transition: none
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="logo">AI</div>
      <div>
        <h1>AI Interview Coach</h1>
        <p>Practice AI / ML interview questions</p>
      </div>
      <div class="status"><i></i>Online</div>
    </header>
    <div id="chat" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form id="f">
      <input id="q" autocomplete="off" placeholder="Type your answer or ask a concept… e.g. what is overfitting"
        aria-label="Message">
      <button type="submit" id="send">Send</button>
    </form>
    <div class="note">Practice tool powered by Gemini AI. Answers may contain mistakes, so verify important facts.</div>
  </div>

  <script>
    const chat = document.getElementById("chat"), input = document.getElementById("q"), sendBtn = document.getElementById("send");
    const history = [];
    function add(text, who, extra) { const d = document.createElement("div"); d.className = "msg " + who + (extra ? " " + extra : ""); d.textContent = text; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d; }
    async function send(text) {
      text = text.trim(); if (!text) return;
      add(text, "user"); input.value = ""; sendBtn.disabled = true;
      const typing = add("", "bot"); typing.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
      try {
        const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text, history }), signal: AbortSignal.timeout(90000) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || "Error");
        typing.textContent = d.reply;
        history.push({ role: "user", text }, { role: "model", text: d.reply });
      } catch (e) { typing.textContent = "⚠️ " + e.message; typing.classList.add("warn"); }
      sendBtn.disabled = false; input.focus(); chat.scrollTop = chat.scrollHeight;
    }
    const CHIPS = [
      ["Easy question", "Ask me an Easy AI interview question."],
      ["Medium question", "Ask me a Medium machine learning interview question."],
      ["Hard question", "Ask me a Hard deep learning interview question."],
      ["GenAI / LLM", "Ask me a Generative AI and LLM interview question."],
      ["NLP", "Ask me an NLP interview question."],
      ["Hint", "Give me a hint for the current question."],
      ["Next", "Next question, please."]
    ];
    const chips = document.getElementById("chips");
    CHIPS.forEach(([label, prompt]) => { const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.onclick = () => send(prompt); chips.appendChild(b); });
    document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); send(input.value); });
    add("Hi! I'm your AI Interview Coach 🎯 Click a button to get a question, type your answer for a score, or ask me any AI/ML concept.", "bot");
    input.focus();
  </script>
</body>

</html>
